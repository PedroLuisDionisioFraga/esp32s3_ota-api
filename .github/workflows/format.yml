name: Format Check

on:
  pull_request:

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned via pip, not apt: the .clang-format uses AlignEscapedNewlines:
      # LeftWithLastLine, which clang-format 18 (the ubuntu-latest default)
      # cannot parse, so it fails to read the config and rejects every file.
      - name: Install clang-format
        run: pip install "clang-format==19.1.7"

      - name: Check formatting
        run: |
          find src include examples -type f \( -name '*.c' -o -name '*.h' \) -print0 \
            | xargs -0 -r clang-format --dry-run --Werror
